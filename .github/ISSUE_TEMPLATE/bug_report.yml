name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. The more you can tell us, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps, one per line.
      placeholder: |
        1. Play a song in Spotify
        2. Hover the notch
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sleepy Notch version
      description: The release you downloaded, or "built from source".
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: Apple menu → About This Mac.
      placeholder: "MacBook Air 13-inch, M3"
    validations:
      required: true
  - type: dropdown
    id: music
    attributes:
      label: Music app (if it's about music)
      options:
        - Not about music
        - Apple Music
        - Spotify
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Drag them in here. They help a lot with anything visual.
